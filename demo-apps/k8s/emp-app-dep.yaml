apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: emp-app
  name: emp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emp-app
  template:
    metadata:
      labels:
        app: emp-app
    spec:
      containers:
      - image: akilan/demo-emp-app:v1
        name: demo-emp-app
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PORT
          value: "9000"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: emp-app-secret
              key: emp-sec-key

---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: emp-app
  name: emp-app-svc
spec:
  ports:
  - port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: emp-app
  type: NodePort
status:
  loadBalancer: {}
